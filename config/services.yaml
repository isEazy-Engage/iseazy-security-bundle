services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Iseazy\Security\Listener\GlobalAuthorizationListener:
        tags:
            - { name: kernel.event_listener, event: kernel.request, priority: -100 }

    Iseazy\Security\Authorization\Domain\Service\CapabilityFilter:
        public: true

    Iseazy\Security\Authorization\Domain\Service\CapabilityFilterInterface:
        alias: Iseazy\Security\Authorization\Domain\Service\CapabilityFilter
        public: true

